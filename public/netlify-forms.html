<!doctype html>
<html lang="en-AU">
  <head><meta charset="utf-8" /><title>Form definitions</title></head>
  <body>
    <!-- Static blueprints for Netlify's deploy-time form parser. Do not remove. -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact" />
      <p class="honeypot"><label>Do not fill this out: <input name="bot-field" /></label></p>
      <label>Name <input type="text" name="name" /></label>
      <label>Business name <input type="text" name="business" /></label>
      <label>Email <input type="email" name="email" /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>Enquiry <textarea name="message"></textarea></label>
    </form>

    <form name="ai-opportunity-audit" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="ai-opportunity-audit" />
      <p class="honeypot"><label>Do not fill this out: <input name="bot-field" /></label></p>
      <label>Name <input type="text" name="name" /></label>
      <label>Business name <input type="text" name="business" /></label>
      <label>Email <input type="email" name="email" /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>Objective <textarea name="objective"></textarea></label>
      <label>Enquiry <textarea name="message"></textarea></label>
    </form>
  </body>
</html>
